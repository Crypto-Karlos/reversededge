<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirect</title>
  <script>
    var path = window.location.pathname;
    if (path === "/index.html" || path.endsWith("/index.html")) {
      window.location.replace(window.location.href.replace(/\/index\.html.*$/, "/"));
    }
  </script>
</head>
<body></body>
</html>
